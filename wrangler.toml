# Cloudflare Workers 配置：一个 Worker 同时提供静态站 + 接口
name = "xiangyu"
compatibility_date = "2026-11-19"
main = "./worker/index.mjs"

# 静态资源：构建产物 dist，路由用 hash，未命中回退到 index.html
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

# KV 绑定（WORLD）和 XY_SECRET 在 Cloudflare 控制台里配置：
#   Settings → Variables and Bindings
# 不在文件里写死，避免把 namespace id 提交到公开仓库。
