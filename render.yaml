# Render 一键部署配置（配合云端数据库，服务端无状态）
# 用法：Render → New → Blueprint → 选仓库
# 需要在 Render 后台手动填 XY_DB_URL / XY_DB_KEY（Supabase 的 Project URL 和 service_role key）
services:
  - type: web
    name: xiangyu
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: node server/index.mjs
    healthCheckPath: /api/health
    envVars:
      - key: XY_SECRET
        generateValue: true
      - key: XY_DB_URL
        sync: false
      - key: XY_DB_KEY
        sync: false
